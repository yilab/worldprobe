[package]
name = "worldprobe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The read-only inspector for .world packages: fold, validate, walk the history and its branches, compare any two points of it, watch the state trajectory, run the physics"
repository = "https://github.com/yilab/worldprobe"
keywords = ["openworldformat", "world", "inspector", "egui"]

[dependencies]
eframe = "0.36.2"
serde_json = "1.0.151"

# The format's Rust reference — openworldformat/rust/, published as the
# crate. To build against the sibling checkout instead, add a
# [patch.crates-io] entry pointing at ../openworldformat/rust locally.
openworldformat = "0.5.1"
