name: release

# A tag such as v0.2.0 drafts a GitHub release holding worldprobe built
# for five targets — Linux (x86_64, arm64), macOS (Intel, Apple silicon)
# and Windows — each an archive with the binary, the README and the
# license. The draft waits for a person to publish it. The tag must match
# the version in Cargo.toml. The binaries are unsigned, so macOS asks
# before it opens one the first time.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: The tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "The tag is $TAG but the version is $version"; exit 1; }

  build:
    name: build, ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc, so the Linux builds run on the older systems too.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Run it
        shell: bash
        run: target/release/worldprobe --version
      - name: Pack
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="worldprobe-$TAG-$TARGET"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/worldprobe.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp target/release/worldprobe "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: worldprobe-${{ matrix.target }}
          path: |
            worldprobe-*.tar.gz
            worldprobe-*.zip

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: worldprobe-*
          path: dist/
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "worldprobe $TAG" \
            --notes "The read-only inspector for .world packages. Unpack the archive for your system and run \`worldprobe [PACKAGE]\`. The binaries are unsigned: macOS asks before opening one the first time (or run \`xattr -d com.apple.quarantine worldprobe\`)."
