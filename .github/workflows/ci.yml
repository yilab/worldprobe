name: ci

# Format, lint and test on the three desktops. The sibling-package tests
# skip here — there is no ../songworld or ../openworldformat beside the
# checkout — by design: those packages test themselves in their own
# repositories. Linux needs no window-system headers: eframe loads
# Wayland and X11 at run time.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format and lint
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
